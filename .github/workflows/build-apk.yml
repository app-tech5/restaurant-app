name: Build, test and publish APK

# Envato demo branch only — lean APK, CI-only Maestro gate, then VPS publish.

on:
  push:
    branches: [envato-demo]
  workflow_dispatch:

concurrency:
  group: restaurant-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_FILENAME: ${{ vars.APK_FILENAME }}
  VPS_DOWNLOADS_DIR: ${{ vars.VPS_DOWNLOADS_DIR }}
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_DEMO_MODE: 'true'
  EXPO_PUBLIC_DEMO_EMAIL: ${{ vars.EXPO_PUBLIC_DEMO_EMAIL }}
  EXPO_PUBLIC_DEMO_PASSWORD: ${{ vars.EXPO_PUBLIC_DEMO_PASSWORD }}
  DEMO_PACKAGE_ID: com.goodfood.restaurant.demo
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub Variables
        run: |
          missing=""
          for var in APK_FILENAME VPS_DOWNLOADS_DIR PUBLIC_SITE_URL EXPO_PUBLIC_API_URL EXPO_PUBLIC_DEMO_EMAIL EXPO_PUBLIC_DEMO_PASSWORD; do
            eval "val=\$$var"
            if [ -z "$val" ]; then missing="$missing $var"; fi
          done
          if [ -n "$missing" ]; then
            echo "Variables GitHub manquantes:$missing"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-envato-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-envato-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Create debug keystore for release signing
        run: |
          if [ -f android/app/debug.keystore ]; then
            echo "debug.keystore already present, skipping generation"
          else
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK (Gradle, arm64 only)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --build-cache --no-daemon \
            -PreactNativeArchitectures=arm64-v8a
          ls -lh app/build/outputs/apk/release/

      - name: Prepare APK artifact
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name '*-release.apk' -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found"
            find android/app/build/outputs/apk -name '*.apk' -type f
            exit 1
          fi
          cp "$APK_PATH" "$APK_FILENAME"
          ls -lh "$APK_FILENAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-demo-apk
          path: ${{ env.APK_FILENAME }}
          if-no-files-found: error
          retention-days: 7

  maestro-smoke:
    name: Maestro smoke (emulator)
    needs: [build-apk]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout Maestro flows
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .maestro
          sparse-checkout-cone-mode: false

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: restaurant-demo-apk
          path: artifacts

      - name: Verify APK present
        run: |
          set -euo pipefail
          ls -lh "artifacts/${APK_FILENAME}"
          test -f "artifacts/${APK_FILENAME}"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Maestro smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: arm64-v8a
          target: default
          profile: pixel_4
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 1200
          cores: 3
          ram-size: 4096
          heap-size: 512
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            adb shell input keyevent 82 || true

            curl -fsS --max-time 15 "${EXPO_PUBLIC_API_URL%/}/auth/restaurant-login" -o /dev/null || true

            adb install -r "artifacts/${APK_FILENAME}"
            adb shell monkey -p "${DEMO_PACKAGE_ID}" -c android.intent.category.LAUNCHER 1 || true
            sleep 10

            FLOW=".maestro/ci-smoke.yaml"
            test -f "$FLOW"

            mkdir -p artifacts/maestro
            maestro test "$FLOW" \
              --format junit \
              --output artifacts/maestro/report.xml

            if [ -d "$HOME/.maestro/tests" ]; then
              cp -R "$HOME/.maestro/tests" artifacts/maestro/tests
            fi

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-maestro-smoke
          path: artifacts/maestro/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish APK to VPS
    needs: [maestro-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: restaurant-demo-apk
          path: .

      - name: Prepare downloads directory on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_DOWNLOADS_DIR
          script: |
            mkdir -p "$VPS_DOWNLOADS_DIR"
            chmod 755 "$VPS_DOWNLOADS_DIR"

      - name: Upload APK to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ${{ env.APK_FILENAME }}
          target: ${{ env.VPS_DOWNLOADS_DIR }}/
          overwrite: true

      - name: APK published
        run: |
          BASE="${PUBLIC_SITE_URL%/}"
          echo "APK available at ${BASE}/downloads/${APK_FILENAME}"
