name: Maestro smoke (reuse APK)

# Does NOT build the app. Downloads an already-built APK artifact and runs smoke tests.

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "GitHub Actions run ID that has artifact restaurant-demo-apk"
        required: true
        default: "30691523235"
      maestro_flow:
        description: "Flow under .maestro/"
        required: true
        default: "ci-smoke.yaml"
  push:
    branches: [envato-demo]
    paths:
      - '.github/trigger-maestro'
      - '.maestro/ci-smoke.yaml'
      - '.github/workflows/maestro-smoke.yml'

concurrency:
  group: restaurant-maestro-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_FILENAME: ${{ vars.APK_FILENAME }}
  DEMO_PACKAGE_ID: com.goodfood.restaurant.demo
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

jobs:
  maestro-smoke:
    name: Maestro smoke (reuse APK)
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - name: Checkout Maestro flows
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .maestro
          sparse-checkout-cone-mode: false

      - name: Download existing APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id || '30691523235' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            -n restaurant-demo-apk \
            -D artifacts
          ls -lh "artifacts/${APK_FILENAME}"
          test -f "artifacts/${APK_FILENAME}"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Maestro smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: arm64-v8a
          target: default
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 900
          # Software accel — avoids HV_UNSUPPORTED on some macOS runners
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -accel off -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            adb shell input keyevent 82 || true

            curl -fsS --max-time 15 "${EXPO_PUBLIC_API_URL%/}/auth/restaurant-login" -o /dev/null || true

            adb install -r "artifacts/${APK_FILENAME}"
            adb shell monkey -p "${DEMO_PACKAGE_ID}" -c android.intent.category.LAUNCHER 1 || true
            sleep 10

            FLOW=".maestro/${{ inputs.maestro_flow || 'ci-smoke.yaml' }}"
            test -f "$FLOW"

            mkdir -p artifacts/maestro
            maestro test "$FLOW" \
              --format junit \
              --output artifacts/maestro/report.xml

            if [ -d "$HOME/.maestro/tests" ]; then
              cp -R "$HOME/.maestro/tests" artifacts/maestro/tests
            fi

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-maestro-smoke
          path: artifacts/maestro/
          if-no-files-found: warn
          retention-days: 14
