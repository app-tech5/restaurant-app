appId: com.goodfood.restaurant
---
- launchApp
- waitForAnimationToEnd
- tapOn: "Open menu"
- waitForAnimationToEnd
- tapOn: "Menu"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Chicken.*|.*Duck.*|.*Menu.*|.*Add.*"
    timeout: 8000
- takeScreenshot: 05-menu
- scroll
- waitForAnimationToEnd
- takeScreenshot: 05b-menu-scrolled
- tapOn:
    text: "Categories"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05c-menu-categories
- back
- waitForAnimationToEnd
- tapOn:
    text: "Add"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05d-add-menu-item
